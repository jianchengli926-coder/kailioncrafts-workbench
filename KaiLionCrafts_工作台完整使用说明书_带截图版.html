<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KaiLionCrafts AI工作台 · 完整使用说明书（带截图版）</title>
<style>
:root{--primary:#c8102e;--dark:#1a1a2e;--dark2:#16213e;--bg:#f5f6fa;--card:#fff;--text:#2c3e50;--text2:#7f8c8d;--border:#e0e0e0;--green:#27ae60;--blue:#2980b9;--orange:#e67e22}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.8}
.hero{background:linear-gradient(135deg,var(--dark),var(--dark2));color:#fff;padding:50px 20px;text-align:center}
.hero h1{font-size:2.4em;margin-bottom:10px}
.hero .sub{opacity:.85;font-size:1.15em;margin-bottom:20px}
.hero .badges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.hero .badge{background:rgba(255,255,255,.15);padding:5px 16px;border-radius:20px;font-size:.88em}
.wrapper{display:flex;max-width:1400px;margin:0 auto}
.sidebar{width:260px;background:#fff;border-right:1px solid var(--border);padding:20px;position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0}
.sidebar h3{font-size:.85em;color:var(--text2);margin:15px 0 8px;text-transform:uppercase;letter-spacing:1px}
.sidebar a{display:block;padding:6px 10px;color:var(--text);text-decoration:none;border-radius:6px;font-size:.92em}
.sidebar a:hover{background:var(--bg);color:var(--primary)}
.sidebar a.active{background:#fff0f1;color:var(--primary);font-weight:600}
.search-box{margin-bottom:15px}
.search-box input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:.95em}
.main{flex:1;padding:30px;min-width:0}
.card{background:var(--card);border-radius:12px;padding:28px;margin-bottom:24px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card h2{color:var(--dark);border-left:4px solid var(--primary);padding-left:14px;margin-bottom:16px;font-size:1.45em}
.card h3{color:var(--dark);margin:20px 0 12px;font-size:1.2em}
.card h4{color:var(--text);margin:14px 0 8px;font-size:1.05em}
.card p{margin-bottom:10px}
.card ul,.card ol{margin:10px 0 14px 22px}
.card li{margin-bottom:6px}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.78em;margin-right:5px;font-weight:500}
.tag-ai{background:#e3f2fd;color:#1565c0}
.tag-free{background:#e8f5e9;color:#2e7d32}
.tag-config{background:#fff3e0;color:#e65100}
.tag-optional{background:#f3e5f5;color:#7b1fa2}
.step{display:flex;gap:14px;margin:14px 0}
.step-num{background:var(--primary);color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0;font-size:.95em}
.step-content{flex:1}
.tip{background:#e3f2fd;border-left:4px solid var(--blue);padding:14px 18px;border-radius:0 8px 8px 0;margin:14px 0}
.warning{background:#fff3e0;border-left:4px solid var(--orange);padding:14px 18px;border-radius:0 8px 8px 0;margin:14px 0}
.success{background:#e8f5e9;border-left:4px solid var(--green);padding:14px 18px;border-radius:0 8px 8px 0;margin:14px 0}
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:.92em}
th,td{border:1px solid var(--border);padding:10px 14px;text-align:left}
th{background:var(--dark);color:#fff}
tr:nth-child(even){background:var(--bg)}
code{background:#f0f0f0;padding:2px 7px;border-radius:4px;font-family:"SF Mono",Monaco,monospace;font-size:.88em;color:var(--primary)}
.feature-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin:16px 0}
.feature-item{background:var(--bg);border-radius:10px;padding:18px;border:1px solid var(--border)}
.feature-item .icon{font-size:2em;margin-bottom:8px}
.feature-item .name{font-weight:600;margin-bottom:6px;font-size:1.05em}
.feature-item .desc{font-size:.88em;color:var(--text2)}
.screenshot{margin:16px 0;border-radius:10px;overflow:hidden;border:2px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.screenshot img{width:100%;display:block}
.screenshot .cap{background:var(--dark);color:#fff;padding:8px 16px;font-size:.88em;text-align:center}
details{margin:10px 0}
summary{cursor:pointer;font-weight:600;padding:10px;background:var(--bg);border-radius:6px}
details[open] summary{background:#e8e8e8}
#backtop{position:fixed;bottom:30px;right:30px;width:48px;height:48px;border-radius:50%;background:var(--primary);color:#fff;border:none;cursor:pointer;font-size:22px;box-shadow:0 2px 10px rgba(0,0,0,.25);display:none;z-index:999}
@media(max-width:900px){.wrapper{flex-direction:column}.sidebar{width:100%;height:auto;position:relative;border-right:none;border-bottom:1px solid var(--border)}}
</style>
</head>

{id:"start",icon:"🚀",title:"快速开始",items:[
{id:"launch",title:"1. 启动工作台",tags:["开箱即用"],content:`

<div class="step"><div class="step-num">3</div><div class="step-content">输入密码 <code>441723</code>，点「进入」</div></div>
<div class="tip">💡 启动窗口可以关掉，工作台在后台继续运行。要关闭时双击桌面的「关闭企业AI工作台」即可。</div>
<div class="screenshot"><img src="manual_assets/00_login.png" alt="登录页"><div class="cap">登录页 - 输入密码 441723 进入</div></div>
<h4>访问方式</h4>
<table><tr><th>方式</th><th>地址</th><th>说明</th></tr>
<tr><td>本机</td><td>http://localhost:8501</td><td>启动后自动打开</td></tr>
<tr><td>局域网</td><td>http://192.168.1.22:8501</td><td>同WiFi下其他电脑/手机可访问</td></tr></table>

{id:"dashboard",icon:"🏠",title:"仪表盘",items:[
{id:"dash-overview",title:"仪表盘首页",tags:["AI增强"],content:`

{id:"customer",icon:"👥",title:"客户中心",items:[
{id:"cust-analyze",title:"潜在客户分析（最常用）",tags:["AI增强"],content:`
<p>这是最常用的功能之一。输入一个潜在客户的信息，AI帮你分析这个客户值不值得跟、怎么跟。</p>

<div class="step"><div class="step-num">2</div><div class="step-content">在「公司名称」填客户公司名（如 TestKitchen Inc）</div></div>
<div class="step"><div class="step-num">3</div><div class="step-content">填国家（如 United Kingdom）、主营产品（如 kitchen knives）</div></div>
<div class="step"><div class="step-num">4</div><div class="step-content">点「🔍 AI分析」按钮，等10-30秒</div></div>
<p>AI会输出：客户类型、核心业务、目标市场、采购模式推测、预估年采购量、匹配度评分（满分100）、等级（A/B/C/D）、开发建议、跟进频率、风险提示。</p>
<div class="screenshot"><img src="manual_assets/02_customer_center.png" alt="客户中心"><div class="cap">客户中心 - 潜在客户分析表单</div></div>
<div class="success">✅ 实测案例：输入 TestKitchen Wholesale Ltd（英国/厨房刀具），AI生成 88分 A级客户画像，含采购模式、匹配度、开发建议。</div>
`},
{id:"cust-tabs",title:"客户分析5个子功能",tags:["AI增强"],content:`

<table><tr><th>标签</th><th>功能</th><th>是否需要AI</th></tr>

<tr><td>🔍 深度背调</td><td>输入客户网站，AI深度调研</td><td>✅ 需要</td></tr>

`},
{id:"cust-followup",title:"跟进序列",tags:["AI增强"],content:`

<li><b>第2封</b>：3天后跟进，补充信息</li>
<li><b>第3封</b>：7天后跟进，分享案例</li>

{id:"tools",icon:"🛠️",title:"AI工具库",items:[

{id:"faq-list",title:"FAQ",tags:["参考"],content:`
<details><summary>Q: AI调用失败怎么办？</summary><p>A: 工作台有9节点故障转移，一个失败自动切下一个。如果全部在线模型都失败会切到本地Ollama。一般不需要手动处理。</p></details>
<details><summary>Q: AI生成很慢怎么办？</summary><p>A: 正常，复杂分析需要10-30秒。简单问题1-2秒。如果超过60秒没反应，刷新页面重试。</p></details>
<details><summary>Q: 数据存在哪里？安全吗？</summary><p>A: 所有数据都存在本地 data/ 文件夹，不上传第三方。备份只需复制整个工作台文件夹。</p></details>
<details><summary>Q: 如何重启工作台？</summary><p>A: 双击桌面「关闭企业AI工作台」，再双击「启动企业AI工作台」。</p></details>
<details><summary>Q: 忘记密码？</summary><p>A: 密码是 441723。</p></details>
<details><summary>Q: 局域网其他电脑怎么访问？</summary><p>A: 同一WiFi下浏览器打开 http://192.168.1.22:8501</p></details>
<details><summary>Q: 硅基流动模型显示402怎么办？</summary><p>A: 余额不足，不影响使用（故障转移自动跳过）。后续充值或在设置中心换API即可。</p></details>
<details><summary>Q: 本地Ollama模型怎么用？</summary><p>A: 确保Ollama已启动（终端运行 ollama serve），工作台会自动检测到3个本地模型作为兜底。断网时自动使用。</p></details>
`},
]},
];

const toc=document.getElementById('toc'),main=document.getElementById('mainContent');
let tocHTML='',contentHTML='';
sections.forEach((sec)=>{
  tocHTML+=`<h3>${sec.icon} ${sec.title}</h3>`;
  sec.items.forEach((item)=>{
    tocHTML+=`<a href="#${item.id}" data-target="${item.id}">${item.title}</a>`;
    contentHTML+=`<div class="card" id="${item.id}"><h2>${sec.icon} ${item.title}</h2><p>${item.tags.map(t=>`<span class="tag tag-${t.includes('AI')?'ai':t.includes('免费')?'free':t.includes('配置')?'config':'optional'}">${t}</span>`).join('')}</p>${item.content}</div>`;
  });
});
toc.innerHTML=tocHTML;main.innerHTML=contentHTML;

document.getElementById('searchInput').addEventListener('input',function(e){
  const q=e.target.value.toLowerCase();
  document.querySelectorAll('.card').forEach(c=>{c.style.display=(!q||c.textContent.toLowerCase().includes(q))?'':'none'});
  document.querySelectorAll('.sidebar a').forEach(a=>{a.style.display=(!q||a.textContent.toLowerCase().includes(q))?'':'none'});
});
window.onscroll=function(){document.getElementById('backtop').style.display=window.scrollY>300?'block':'none'};
const observer=new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      document.querySelectorAll('.sidebar a').forEach(a=>a.classList.remove('active'));
      const link=document.querySelector(`.sidebar a[data-target="${e.target.id}"]`);
      if(link)link.classList.add('active');
    }
  });
},{rootMargin:'-20% 0px -70% 0px'});
document.querySelectorAll('.card').forEach(c=>observer.observe(c));
</script>
</body>
