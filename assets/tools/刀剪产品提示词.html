<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaiLionCrafts 刀剪外贸独立站 AI 生图 Prompt 场景知识库</title>
    <style>
        :root {
            --bg-main: #f8fafc;
            --sidebar-bg: #0f172a;
            --sidebar-text: #94a3b8;
            --sidebar-active: #ffffff;
            --sidebar-hover: #1e293b;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-color: #d97706;
            --accent-hover: #b45309;
            --accent-light: #fef3c7;
            --border-color: #e2e8f0;
            --code-bg: #1e293b;
            --code-text: #f1f5f9;
            --badge-bg: #f1f5f9;
            --badge-text: #475569;
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 320px;
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .sidebar-header {
            padding: 20px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background-color: #090d16;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.4px;
            color: #fbbf24;
            margin-bottom: 6px;
        }

        .sidebar-header h1 {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-header p {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }

        .nav-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px 8px;
        }

        .nav-category {
            margin-bottom: 12px;
        }

        .nav-category-title {
            font-size: 13px;
            font-weight: 600;
            color: #f1f5f9;
            padding: 8px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .nav-category-title:hover {
            background-color: var(--sidebar-hover);
        }

        .nav-sub-list {
            list-style: none;
            padding-left: 12px;
            margin-top: 4px;
            display: none;
        }

        .nav-category.expanded .nav-sub-list {
            display: block;
        }

        .nav-sub-item {
            font-size: 12px;
            color: var(--sidebar-text);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.15s;
        }

        .nav-sub-item:hover {
            color: #ffffff;
            background-color: var(--sidebar-hover);
        }

        /* Main Content Styling */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: var(--bg-main);
        }

        .top-header {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: var(--shadow-sm);
            z-index: 10;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 500px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 38px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            background-color: #f8fafc;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15);
        }

        .search-box svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-muted);
        }

        .filter-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-chip {
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 16px;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
            user-select: none;
        }

        .filter-chip:hover, .filter-chip.active {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        .stats-badge {
            font-size: 12px;
            color: var(--text-muted);
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 500;
        }

        /* Content Container */
        .content-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            scroll-behavior: smooth;
        }

        .category-section {
            margin-bottom: 36px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border-color);
        }

        .section-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .prompt-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(560px, 1fr));
            gap: 20px;
        }

        /* Card Design */
        .prompt-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .prompt-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            gap: 12px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.4;
        }

        .card-meta {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .badge-ratio {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .badge-tag {
            background-color: #f3f4f6;
            color: #4b5563;
        }

        .card-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.5;
            background-color: #f8fafc;
            padding: 8px 12px;
            border-radius: 6px;
            border-left: 3px solid var(--accent-color);
        }

        .ratio-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .ratio-btn {
            padding: 3px 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: #ffffff;
            color: var(--text-main);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .ratio-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .ratio-btn.active {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
            font-weight: 600;
        }

        /* 提示词与场景图的并行容器 */
        .card-content-wrapper {
            display: flex;
            gap: 14px;
            margin-bottom: 12px;
            flex: 1;
            align-items: stretch;
        }

        .prompt-box {
            position: relative;
            background-color: var(--code-bg);
            color: var(--code-text);
            border-radius: var(--radius-md);
            padding: 14px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            flex: 1;
            max-height: 280px;
            overflow-y: auto;
        }

        /* 右侧可点击上传/预览图片区 (1:1 正方形对称) */
        .image-slot {
            flex: 1;
            aspect-ratio: 1 / 1;
            max-height: 280px;
            background-color: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            padding: 8px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
            cursor: pointer;
            user-select: none;
        }

        .image-slot:hover {
            border-color: var(--accent-color);
            background-color: var(--accent-light);
            color: var(--accent-color);
        }

        .image-slot svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
            margin-bottom: 6px;
            opacity: 0.7;
        }

        .image-slot-text {
            font-size: 11px;
            font-weight: 500;
            line-height: 1.3;
        }

        .image-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .image-hover-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 2;
        }

        .image-slot:hover .image-hover-overlay {
            opacity: 1;
        }

        .remove-img-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            z-index: 4;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, background 0.2s ease;
        }

        .image-slot:hover .remove-img-btn {
            opacity: 1;
            pointer-events: auto;
        }

        .remove-img-btn:hover {
            background: #dc2626;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: auto;
        }

        .action-btn {
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
            height: 36px;
        }

        .translate-btn {
            background-color: #f1f5f9;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            white-space: nowrap;
        }

        .translate-btn:hover {
            background-color: var(--accent-light);
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .copy-btn {
            background-color: var(--accent-color);
            color: #ffffff;
            flex: 1;
        }

        .copy-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background-color: #0f172a;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 8px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 900px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                max-height: 200px;
            }
            .prompt-grid {
                grid-template-columns: 1fr;
            }
            .card-content-wrapper {
                flex-direction: column;
            }
            .image-slot {
                width: 100%;
                min-height: 140px;
            }
            .card-actions {
                flex-direction: column;
            }
            .translate-btn, .copy-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="brand-name">KaiLionCrafts</div>
            <h1>🔪 刀剪 AI 场景提示词库</h1>
            <p>欧美外贸独立站 / B2B / Amazon 专用</p>
        </div>
        <div class="nav-container" id="navContainer">
            <!-- Navigation Items Injected Here -->
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <!-- Top Sticky Bar -->
        <div class="top-header">
            <div class="header-row">
                <div class="search-box">
                    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <input type="text" id="searchInput" placeholder="搜索关键词，如：大马士革、户外、切牛排、Banner、16:9、B2B、QC...">
                </div>
                <div class="stats-badge" id="statsCount">加载中...</div>
            </div>
            <div class="filter-tags" id="filterContainer">
                <span class="filter-chip active" data-filter="all">全部品类</span>
                <span class="filter-chip" data-filter="master">⚙️ 总控制/QC</span>
                <span class="filter-chip" data-filter="kitchen">🔪 厨房刀</span>
                <span class="filter-chip" data-filter="outdoor">🏕️ 户外刀</span>
                <span class="filter-chip" data-filter="scissors">✂️ 剪刀</span>
                <span class="filter-chip" data-filter="accessories">🍳 厨房配件</span>
                <span class="filter-chip" data-filter="brand">🏢 独立站/B2B</span>
                <span class="filter-chip" data-filter="video">🎬 AI短视频</span>
            </div>
        </div>

        <!-- Scrollable Content Body -->
        <div class="content-body" id="contentBody">
            <!-- Prompt Cards Rendered Dynamically -->
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span id="toastMsg">提示词已成功复制到剪贴板！</span>
    </div>

    <script>
        const promptData = [
  {
    "id": "master_controls",
    "category": "master",
    "category_name": "⚙️ 总控制与质量系统",
    "subcategories": [
      {
        "id": "master_general",
        "title": "通用产品识别母提示词 (Master Prompt)",
        "scene_desc": "适合每次上传白底图后的首发指令，自动识别产品类别、材质、造型，锁定产品100%一致性并判断欧美消费场景。",
        "target": "全品类通用 / Gemini / GPT Image",
        "tags": ["母提示词", "产品分析", "全品类"],
        "prompt": "You are a professional commercial product photographer and art director specializing in Amazon, Shopify, and premium independent e-commerce brands targeting US and European markets.\n\nAnalyze the uploaded product image carefully.\n\nFirst identify:\n- product category (kitchen knife / outdoor knife / scissors / kitchen accessory)\n- material and finish\n- shape and design characteristics\n- realistic Western usage scenarios\n- target customer group (home cook, chef, outdoor enthusiast, professional)\n- market positioning (premium daily use / professional / gift)\n\nBased on real selling environments on Amazon US, European retailers, and independent lifestyle brands, create a realistic lifestyle product photography scene.\n\nThe product in the reference image must remain 100% identical:\n- same shape, dimensions, blade geometry, handle design, texture, color, and details\n\nDo not redesign the product. Do not add extra parts. Do not modify the structure.\n\nCreate a realistic commercial photo suitable for independent website product pages, e-commerce homepage, and brand marketing banners.\n\nThe image must look like a real professional photograph, not AI generated.\n\nRequirements: natural lighting, real environment, realistic human interaction, authentic materials, subtle imperfections, premium but believable atmosphere, professional product photography, high-end lifestyle commercial photography for Western audiences.",
        "prompt_zh": "你是一位专业商业产品摄影师与艺术总监，专注于面向美国与欧洲市场的 Amazon、Shopify 及高端独立站品牌。\n\n仔细分析上传的产品图片。\n\n首先识别：\n- 产品品类（厨房刀 / 户外刀 / 剪刀 / 厨房配件）\n- 材质与表面处理\n- 造型与设计特征\n- 真实的欧美使用场景\n- 目标客户群体（家庭厨娘、专业厨师、户外爱好者、专业人士）\n- 市场定位（日常高端 / 专业 / 礼品）\n\n基于 Amazon 美国站、欧洲零售商与独立生活方式品牌的真实销售环境，创建逼真的生活方式产品摄影场景。\n\n参考图中的产品必须保持 100% 一致：造型、尺寸、刃型、柄型、纹理、颜色与细节均不可改变。\n\n请勿重新设计产品、添加部件或修改结构。\n\n创建适用于独立站产品页、电商首页与品牌营销 Banner 的逼真商业照片。\n\n图片必须看起来像真实专业摄影师拍摄，而非 AI 生成。\n\n要求：自然光线、真实环境、逼真人体交互、真实材质、细微自然瑕疵、高端但可信的氛围、专业产品摄影、面向欧美客户的高端生活方式商业摄影。"
      },
      {
        "id": "qc_identity",
        "title": "QC：产品100%一致性锁定",
        "scene_desc": "防翻车必备，防止 AI 改刀型、刃弧、手柄铆钉或加假 Logo。",
        "target": "所有模型",
        "tags": ["QC防翻车", "外观锁定"],
        "prompt": "PRODUCT IDENTITY PROTECTION:\n\nThe uploaded product is the exact product reference.\n\nMaintain 100% identical: overall shape, dimensions, proportions, blade geometry, blade curve, blade thickness, handle design, screws, rivets, texture, logo position, material appearance.\n\nDo not redesign, improve, modify, simplify, or add decorative elements.\n\nThe product must look like the same physical item photographed in another environment.",
        "prompt_zh": "产品身份保护：\n\n上传产品为精准参考。保持 100% 一致：整体造型、尺寸、比例、刀刃几何与弧度、厚度、手柄设计、螺丝、铆钉、纹理、Logo 位置、材质外观。\n\n严禁重新设计、改进、修改、简化或添加装饰。\n\n产品必须像在另一环境中拍摄的同一实体物品。"
      },
      {
        "id": "qc_blade",
        "title": "QC：刀刃纹理与金属真实感",
        "scene_desc": "保护大马士革纹、拉丝、镜面等金属物理质感。",
        "target": "厨刀/户外刀",
        "tags": ["QC", "大马士革", "金属质感"],
        "prompt": "BLADE DETAIL PRESERVATION & METAL REALISM:\n\nPreserve original blade characteristics: Damascus pattern, steel grain, brushed metal texture, polished reflection, edge line, grinding marks.\n\nDo not create fake patterns or replace blade material.\n\nCreate realistic stainless steel behavior that follows environment lighting, shows natural highlights, and maintains metal texture.\n\nAvoid chrome mirror effect, liquid metal, plastic appearance, CGI rendering.",
        "prompt_zh": "刀刃细节与金属真实感：保留大马士革纹、钢材纹理、拉丝质感、抛光光泽、刃线、研磨痕迹。禁止虚假纹理或替换材质。呈现遵循环境光的自然高光与金属质感。避免电镀镜面、液态金属、塑料感与 CGI 渲染。"
      },
      {
        "id": "qc_hand",
        "title": "QC：手部真实度与使用逻辑",

            container.innerHTML = '';

            promptData.forEach(cat => {
                const catDiv = document.createElement('div');
                catDiv.className = 'nav-category expanded';
                
                const titleDiv = document.createElement('div');
                titleDiv.className = 'nav-category-title';
                titleDiv.innerHTML = `<span>${cat.category_name}</span> <span>▼</span>`;
                titleDiv.onclick = () => {
                    catDiv.classList.toggle('expanded');
                };

                const subList = document.createElement('ul');
                subList.className = 'nav-sub-list';

                cat.subcategories.forEach(sub => {
                    const itemLi = document.createElement('li');
                    itemLi.className = 'nav-sub-item';
                    itemLi.textContent = sub.title;
                    itemLi.onclick = (e) => {
                        e.stopPropagation();
                        scrollToCard(sub.id);
                    };
                    subList.appendChild(itemLi);
                });

                catDiv.appendChild(titleDiv);
                catDiv.appendChild(subList);
                container.appendChild(catDiv);
            });
        }

        function renderPrompts() {
            const contentBody = document.getElementById('contentBody');
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            contentBody.innerHTML = '';

            let totalCount = 0;

            promptData.forEach(cat => {
                if (currentFilter !== 'all' && cat.category !== currentFilter) return;

                const matchingSubs = cat.subcategories.filter(sub => {
                    if (!searchVal) return true;
                    return sub.title.toLowerCase().includes(searchVal) ||
                           sub.scene_desc.toLowerCase().includes(searchVal) ||
                           sub.tags.some(t => t.toLowerCase().includes(searchVal)) ||
                           sub.prompt.toLowerCase().includes(searchVal) ||
                           (sub.prompt_zh && sub.prompt_zh.toLowerCase().includes(searchVal));
                });

                if (matchingSubs.length === 0) return;

                totalCount += matchingSubs.length;

                const secDiv = document.createElement('div');
                secDiv.className = 'category-section';

                const secHeader = document.createElement('div');
                secHeader.className = 'section-header';
                secHeader.innerHTML = `<h2>${cat.category_name}</h2><span class="stats-badge">${matchingSubs.length} 个场景</span>`;
                secDiv.appendChild(secHeader);

                const gridDiv = document.createElement('div');
                gridDiv.className = 'prompt-grid';

                const isMasterCategory = (cat.category === 'master');

                matchingSubs.forEach(sub => {
                    const isZh = langState[sub.id] === 'zh';
                    let activePromptText = isZh ? (sub.prompt_zh || sub.prompt) : sub.prompt;

                    const curRatio = ratioState[sub.id] || (sub.target.includes('16:9') ? '16:9' : '1:1');
                    activePromptText += `\n\nAspect ratio: ${curRatio} (--ar ${curRatio})`;

                    const card = document.createElement('div');
                    card.className = 'prompt-card';
                    card.id = `card_${sub.id}`;

                    const uploadedImg = imageState[sub.id];

                    card.innerHTML = `
                        <div class="card-header">
                            <div>
                                <div class="card-title">${sub.title}</div>
                                <div class="card-meta" style="margin-top:6px;">
                                    <span class="badge badge-ratio">${sub.target}</span>
                                    ${sub.tags.map(t => `<span class="badge badge-tag">${t}</span>`).join('')}
                                </div>
                            </div>
                        </div>
                        <div class="card-desc">${sub.scene_desc}</div>
                        
                        <div class="ratio-selector">
                            <span>尺寸比例:</span>
                            <button class="ratio-btn ${curRatio === '1:1' ? 'active' : ''}" onclick="setRatio('${sub.id}', '1:1')">1:1</button>
                            <button class="ratio-btn ${curRatio === '16:9' ? 'active' : ''}" onclick="setRatio('${sub.id}', '16:9')">16:9</button>
                            <button class="ratio-btn ${curRatio === '4:3' ? 'active' : ''}" onclick="setRatio('${sub.id}', '4:3')">4:3</button>
                            <button class="ratio-btn ${curRatio === '3:2' ? 'active' : ''}" onclick="setRatio('${sub.id}', '3:2')">3:2</button>
                        </div>

                        <div class="card-content-wrapper">
                            <div class="prompt-box" id="prompt_${sub.id}">${activePromptText}</div>
                            
                            ${!isMasterCategory ? `
                                <input type="file" id="file_input_${sub.id}" accept="image/*" style="display:none;" onchange="handleImageUpload(event, '${sub.id}')">

                                <div class="image-slot" onclick="triggerFileInput('${sub.id}')" title="点击选择本地图片上传预览">
                                    ${uploadedImg ? `
                                        <img src="${uploadedImg}" alt="预览图片">
                                        <button class="remove-img-btn" onclick="removeImage(event, '${sub.id}')" title="删除图片">✕</button>
                                        <div class="image-hover-overlay">更换图片</div>
                                    ` : `
                                        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                                        <span class="image-slot-text">点击插入图片<br>(参考/生成效果)</span>
                                    `}
                                </div>
                            ` : ''}
                        </div>

                        <div class="card-actions">
                            <button class="action-btn translate-btn" onclick="toggleLang('${sub.id}')">
                                🌐 ${isZh ? '还原英文' : '翻译中文'}
                            </button>
                            <button class="action-btn copy-btn" onclick="copyPrompt('${sub.id}')">
                                📋 一键复制 Prompt
                            </button>
                        </div>
                    `;

                    gridDiv.appendChild(card);
                });

                secDiv.appendChild(gridDiv);
                contentBody.appendChild(secDiv);
            });

            document.getElementById('statsCount').textContent = `共 ${totalCount} 条场景提示词`;
        }

        function setRatio(id, ratio) {
            ratioState[id] = ratio;
            renderPrompts();
        }

        function toggleLang(id) {
            langState[id] = (langState[id] === 'zh') ? 'en' : 'zh';
            renderPrompts();
        }

        function triggerFileInput(id) {
            const input = document.getElementById(`file_input_${id}`);
            if (input) input.click();
        }

        // 处理选择图片：包含自动像素压缩 & 保存至本地存储
        function handleImageUpload(event, id) {
            const file = event.target.files[0];
            if (file) {
                compressAndSaveImage(file, id);
                event.target.value = ''; // 清空 input 允许重复选择同名图片
            }
        }

        // 核心功能：Canvas 算法压缩图片（限制最大 350x350 像素，质量 0.7）
        function compressAndSaveImage(file, id) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const maxWidth = 350;
                    const maxHeight = 350;
                    let width = img.width;
                    let height = img.height;

                    // 计算缩放比例，保持长宽比
                    if (width > height) {
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width = Math.round((width * maxHeight) / height);
                            height = maxHeight;
                        }
                    }

                    // 创建 Canvas 重新绘制并压缩
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // 导出压缩后的低像素 JPEG 格式 Base64 数据
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

                    // 存入内存与 LocalStorage 本地存储
                    imageState[id] = compressedBase64;
                    saveImageState();
                    renderPrompts();
                    showToast("图片已自动压缩并持久化保存！");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function removeImage(event, id) {
            event.stopPropagation();
            delete imageState[id];
            saveImageState(); // 移除后同步更新 localStorage
            renderPrompts();
            showToast("已删除缩略图");
        }

        function copyPrompt(id) {
            const promptBox = document.getElementById(`prompt_${id}`);
            if (!promptBox) return;

            const textToCopy = promptBox.innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast("提示词已成功复制到剪贴板！");
            }).catch(err => {
                showToast("复制失败，请手动选择复制");
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function scrollToCard(id) {
            const el = document.getElementById(`card_${id}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.style.borderColor = 'var(--accent-color)';
                el.style.boxShadow = '0 0 0 2px rgba(217,119,6,0.3)';
                setTimeout(() => {
                    el.style.borderColor = '';
                    el.style.boxShadow = '';
                }, 2000);
            }
        }

        document.getElementById('filterContainer').addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-chip')) {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.getAttribute('data-filter');
                renderPrompts();
            }
        });

        document.getElementById('searchInput').addEventListener('input', () => {
            renderPrompts();
        });

        window.addEventListener('DOMContentLoaded', () => {
            loadSavedImages(); // 页面加载时自动恢复已存图片
            initNav();
            renderPrompts();
        });
    </script>
</body>
</html>
