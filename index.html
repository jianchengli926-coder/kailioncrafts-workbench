function startAutoSearch(){
  if(searchRunning){ toast('搜客正在进行中...'); return; }
  const kw = document.getElementById('as_keyword').value.trim();
  const country = document.getElementById('as_country').value;
  const city = document.getElementById('as_city').value.trim();
  const sources = Array.from(document.querySelectorAll('.as_source:checked')).map(c=>c.value);
  if(!kw){ toast('请输入产品关键词'); return; }
  if(!sources.length){ toast('请至少选择一个数据来源'); return; }
  searchRunning = true;
  document.getElementById('as_startBtn').disabled = true;
  document.getElementById('as_startBtn').textContent = '搜客中...';
  document.getElementById('as_progress').style.display = 'block';
  document.getElementById('as_log').innerHTML = '';
  searchResults = [];
  let progress = 0;
  const totalSteps = sources.length * 3;
  let step = 0;
  const sourceNames = {map:'谷歌地图',customs:'海关数据',social:'社媒平台'};
  const logEl = document.getElementById('as_log');
  function addLog(msg){ logEl.innerHTML += `<div>▶ ${msg}</div>`; logEl.scrollTop = logEl.scrollHeight; }
  function nextStep(){
    if(step >= totalSteps){
      // 完成
      searchRunning = false;
      document.getElementById('as_startBtn').disabled = false;
      document.getElementById('as_startBtn').textContent = '🚀 一键启动搜客';
      document.getElementById('as_progressText').textContent = '✅ 搜客完成！';
      document.getElementById('as_progressPct').textContent = '100%';
      document.getElementById('as_progressBar').style.width = '100%';
      addLog(`搜客完成！共找到 ${searchResults.length} 家潜在客户`);
      // 保存历史
      if(!S.autoSearch) S.autoSearch = {results:[],history:[],totalSearches:0,totalFound:0,totalImported:0};
      S.autoSearch.totalSearches = (S.autoSearch.totalSearches||0)+1;
      S.autoSearch.totalFound = (S.autoSearch.totalFound||0)+searchResults.length;
      const hid = uid();
      S.autoSearch.history.unshift({id:hid,time:new Date().toLocaleString('zh-CN'),keyword:kw,country:country,city:city,sources:sources.map(s=>sourceNames[s]||s).join('+'),found:searchResults.length,imported:0,results:JSON.parse(JSON.stringify(searchResults))});
      if(S.autoSearch.history.length>20) S.autoSearch.history = S.autoSearch.history.slice(0,20);
      S.autoSearch.results = JSON.parse(JSON.stringify(searchResults));
      try{ DB.save('autoSearch',S.autoSearch); }catch(e){}
      document.getElementById('as_resultCount').textContent = `（${searchResults.length}家）`;
      document.getElementById('as_resultsList').innerHTML = renderSearchResults();
      toast(`搜客完成！找到 ${searchResults.length} 家潜在客户`);
      return;
    }
    const srcIdx = Math.floor(step/3);
    const subStep = step%3;
    const src = sources[srcIdx];
    progress = Math.round((step/totalSteps)*100);
    document.getElementById('as_progressBar').style.width = progress+'%';
    document.getElementById('as_progressPct').textContent = progress+'%';
    if(subStep===0){
      document.getElementById('as_progressText').textContent = `正在搜索${sourceNames[src]}...`;
      addLog(`开始搜索${sourceNames[src]}：关键词="${kw}"，国家=${country}${city?'，城市='+city:''}`);
    } else if(subStep===1){
      document.getElementById('as_progressText').textContent = `正在${sourceNames[src]}筛选匹配客户...`;
      // 模拟找到客户
      const count = Math.floor(Math.random()*4)+2;
      const shuffled = [...MOCK_COMPANIES].sort(()=>Math.random()-0.5);
      for(let i=0;i<count && i<shuffled.length;i++){
        const c = shuffled[i];
        if(!searchResults.find(r=>r.name===c.name)){
          searchResults.push({...c, source:src, match:Math.min(95,c.match+Math.floor(Math.random()*10)-5), selected:false});
        }
      }
      addLog(`${sourceNames[src]}找到 ${count} 家匹配客户`);
    } else {
      document.getElementById('as_progressText').textContent = `正在${sourceNames[src]}挖掘决策人联系方式...`;
      addLog(`${sourceNames[src]}决策人挖掘完成`);
    }
    step++;
    setTimeout(nextStep, 600+Math.random()*400);
  }
  nextStep();
}

function toggleSelectAll(cb){
  document.querySelectorAll('.as_result_check').forEach(c=>c.checked=cb.checked);
  searchResults.forEach((r,i)=>r.selected=cb.checked);
}
function selectAllResults(){ document.querySelectorAll('.as_result_check').forEach(c=>c.checked=true); searchResults.forEach(r=>r.selected=true); }
function deselectAllResults(){ document.querySelectorAll('.as_result_check').forEach(c=>c.checked=false); searchResults.forEach(r=>r.selected=false); }

function importSingleResult(idx){
  const r = searchResults[idx];
  if(!r) return;
  importResultToCRM(r);
  searchResults.splice(idx,1);
  document.getElementById('as_resultsList').innerHTML = renderSearchResults();
  document.getElementById('as_resultCount').textContent = `（${searchResults.length}家）`;
}

function importSelectedResults(){
  const selected = searchResults.filter(r=>r.selected);
  if(!selected.length){ toast('请先选择要导入的客户'); return; }
  selected.forEach(r=>importResultToCRM(r));
  searchResults = searchResults.filter(r=>!r.selected);
  document.getElementById('as_resultsList').innerHTML = renderSearchResults();
  document.getElementById('as_resultCount').textContent = `（${searchResults.length}家）`;
  toast(`已导入 ${selected.length} 家客户到台账`);
}

function importResultToCRM(r){
  if(!S.customers) S.customers = [];
  // 去重
  if(S.customers.find(c=>c.company===r.name || (r.email && c.contact&&c.contact.email===r.email))){ return; }
  const newCust = {
    id:uid(), company:r.name, country:r.country, city:r.city, address:r.addr||'',
    website:r.website||'', source:r.source==='map'?'谷歌地图':r.source==='customs'?'海关数据':'社媒搜客',
    type:r.type||'潜在客户', status:'新线索', createdAt:new Date().toISOString(),
    contact:{name:'',title:'',email:r.email||'',phone:r.phone||'',whatsapp:r.phone||'',linkedin:''},
    scores:{total:r.match||50, grade:r.match>=80?'A':r.match>=60?'B':'C'},
    nextFollowUp:null, tags:[r.type||'']
  };
  S.customers.unshift(newCust);
  if(!S.autoSearch) S.autoSearch = {results:[],history:[],totalSearches:0,totalFound:0,totalImported:0};
  S.autoSearch.totalImported = (S.autoSearch.totalImported||0)+1;
  try{ DB.save('autoSearch',S.autoSearch); DB.save('customers',S.customers); }catch(e){}
}

function exportResultsCSV(){
  if(!searchResults.length){ toast('暂无结果可导出'); return; }
  const headers = ['公司名称','国家','城市','地址','电话','邮箱','官网','类型','规模','匹配度','来源'];
  const rows = searchResults.map(r=>[r.name,r.country,r.city||'',r.addr||'',r.phone||'',r.email||'',r.website||'',r.type||'',r.size||'',r.match,r.source]);
  const csv = '\uFEFF'+[headers,...rows].map(row=>row.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = '搜客结果_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  toast('已导出CSV文件');
}

function clearSearchResults(){
  confirmDlg('确定清空当前搜客结果？（已导入台账的客户不受影响）', ()=>{
    searchResults = [];
    document.getElementById('as_resultsList').innerHTML = renderSearchResults();
    document.getElementById('as_resultCount').textContent = '（0家）';
    toast('已清空搜客结果');
  });
}

function loadSearchHistory(hid){
  if(!S.autoSearch||!S.autoSearch.history) return;
  const h = S.autoSearch.history.find(x=>x.id===hid);
  if(!h||!h.results) return;
  searchResults = JSON.parse(JSON.stringify(h.results));
  document.getElementById('as_resultsList').innerHTML = renderSearchResults();
  document.getElementById('as_resultCount').textContent = `（${searchResults.length}家）`;
  toast(`已加载历史搜客结果：${h.keyword}（${searchResults.length}家）`);
}

      `From sample to 50K units in 60 days — here's what happened\n\nA European ${audience} needed a custom kitchen shear design for their spring catalog. Timeline was tight — 60 days from sample approval to container loading.\n\nWhat we did:\n📐 Day 1-3: 3D design + material selection\n🔨 Day 4-10: Prototype (2 rounds of revisions)\n✅ Day 11: Sample approved\n🏭 Day 12-45: Mass production with daily QC photos\n🚢 Day 46-55: Inspection + packing\n📦 Day 56-60: Container loaded + on the way\n\nResult: delivered 2 days ahead of schedule. Zero defects in the first inspection.\n\nThe client's spring line sold out in 3 weeks.\n\n#OEM #kitchenware #manufacturing #supplychain`

  } else if(type==='行业洞察'){

      `3 kitchenware trends that will define 2026 sourcing\n\nAfter working with 50+ kitchenware brands this year, here's what I'm seeing:\n\n1️⃣ Eco-friendly materials are no longer optional\nPlant-based handles, recycled steel, biodegradable packaging — buyers are asking for it, retailers are requiring it. We've invested in 2 new eco-material lines.\n\n2️⃣ Space-saving designs are growing 35% YoY\nSmaller kitchens in urban areas = demand for multi-function tools, magnetic storage, compact sets. Our 3-in-1 shear design is our bestseller this year.\n\n3️⃣ Transparency is the new competitive advantage\nBuyers want factory tours, QC reports, material traceability. We now provide live factory video calls and digital QC dashboards for every order.\n\nThe brands that adapt early will win. The ones that wait... will be looking for new suppliers.\n\n#kitchenware #sourcing #trends2026 #manufacturing`,
      `Why 70% of kitchenware importers are overpaying — and how to fix it\n\nI review 20+ supplier quotes every month for kitchenware brands. Here's the pattern I see:\n\nMost importers focus only on unit price. But unit price is just 60% of total cost.\n\nThe hidden 40%:\n💸 Defect rates (1% vs 8% = huge difference)\n💸 Air freight for rush orders (late shipments)\n💸 Rework costs (wrong specs, bad packaging)\n💸 Opportunity cost (missed seasons, lost sales)\n\nA supplier that's $0.20 cheaper per unit but has 5% defects and 10-day delays actually costs you MORE.\n\nHow to fix it:\n✅ Ask for defect rate data (not just claims)\n✅ Check their on-time delivery record\n✅ Request references from similar-sized clients\n✅ Visit the factory (or do a live video tour)\n\nCheap isn't always cost-effective.\n\n#sourcing #kitchenware #procurement #supplychain`
    ];
  } else if(type==='产品知识'){
    posts = [
      `Kitchen shear quality: 5 things most buyers get wrong\n\nAfter 20 years making kitchen shears in Yangjiang, here's what separates a $2 shear from a $10 shear:\n\n1️⃣ Steel grade matters more than thickness\n2Cr13 vs 3Cr13 vs 4Cr13 — higher carbon = better edge retention. A 2mm 4Cr13 blade outperforms a 3mm 2Cr13 blade.\n\n2️⃣ The pivot screw is the heart of the shear\nA cheap loose pivot = blades separate when cutting. We use custom-machined pivots with lock nuts. Test: hold shear vertically, blades should NOT separate.\n\n3️⃣ Handle material isn't just about comfort\nPP handles crack in cold weather. TPR handles get sticky over time. We use PP+TPR co-molding for durability AND comfort.\n\n4️⃣ Edge grinding angle affects sharpness\n15° = razor sharp but chips easily. 25° = durable but needs more force. We use 20° for kitchen shears — the sweet spot.\n\n5️⃣ Certification isn't optional for food contact\nLFGB (Germany) is stricter than FDA (US). If you sell in Europe, demand LFGB. We provide both for every batch.\n\nA $2 shear costs you more in returns. A $10 shear builds your brand.\n\n#kitchenware #productquality #OEM #manufacturing`,
      `LFGB vs FDA: which certification do you actually need for kitchen tools?\n\nThis is the #1 question I get from new kitchenware buyers.\n\nShort answer: if you sell in Europe → LFGB. If you sell in the US → FDA. If both → get both (we do).\n\nBut here's what most people don't know:\n\n🔬 LFGB (German Food and Feed Code)\n- Tests for 30+ substances (heavy metals, formaldehyde, phthalates)\n- Includes sensory testing (taste/odor transfer)\n- Required for Germany, and effectively the EU standard\n- More expensive, stricter, but universally accepted\n\n🔬 FDA (US Food and Drug Administration)\n- Tests for specific materials (stainless steel, plastics, coatings)\n- No sensory testing requirement\n- Required for US market\n- Less expensive, but not accepted in Europe\n\n💡 Pro tip: Even if you only sell in the US, getting LFGB gives you a marketing advantage — "European-grade quality" resonates with premium buyers.\n\nWe provide both certifications for every batch, included in the price. No surprises.\n\n#kitchenware #certification #LFGB #FDA #sourcing`
    ];
  } else if(type==='经验分享'){
    posts = [
      `5 things I wish I knew before starting kitchenware OEM manufacturing\n\n20 years ago, I started in a small Yangjiang workshop with 5 workers. Today, we ship 500K+ units/month to 20+ countries.\n\nHere's what I wish someone told me on day 1:\n\n1️⃣ Quality is the only marketing that works\nEarly on, I took every order at any price. One bad batch cost me 3 clients. Since then, zero-defect policy = our growth engine.\n\n2️⃣ Communication prevents 90% of problems\nMost factory disputes come from miscommunication. We now do daily photo updates, weekly video calls, and written spec confirmations for every order.\n\n3️⃣ Certifications are an investment, not a cost\nLFGB, FDA, BSCI — getting certified early opened doors that would've stayed closed. We got our first European client BECAUSE we had LFGB before they asked.\n\n4️⃣ Your best employees are your best marketing\nOur production manager has been with us 15 years. Clients meet him on factory tours and trust us immediately. Invest in your team.\n\n5️⃣ The client who pushes you hardest makes you better\nWe had a Japanese client with impossible QC standards. We failed their first 3 inspections. Then we improved. Now their standards are our minimum standard for ALL clients.\n\nManufacturing isn't about making products. It's about building trust.\n\n#manufacturing #OEM #kitchenware #entrepreneurship`,
      `How to vet a kitchenware factory in 30 minutes (without visiting)\n\nYou can't visit every factory. But you CAN vet them effectively in 30 minutes.\n\nHere's my checklist:\n\n📞 1. Video call the factory (5 min)\n- Ask to see the production floor LIVE\n- Count workers (under 10 = trading company, not factory)\n- Look for organized workstations vs chaos\n\n📋 2. Ask for these documents (10 min)\n- Business license (check registered capital and year established)\n- LFGB/FDA test reports (verify they're recent and for YOUR product type)\n- BSCI/Sedex audit report (if they claim ethical manufacturing)\n- Client references (at least 2 from your country)\n\n🔍 3. Technical questions (10 min)\n- "What steel grade do you use for kitchen shears?" (correct: 3Cr13 or 4Cr13)\n- "What's your typical defect rate?" (acceptable: under 2%; if they say 0%, they're lying)\n- "What's your MOQ for custom designs?" (real factory: 500-1000pcs; trading company: 3000+)\n- "Can you show me your QC process?" (real factory: IQC → IPQC → FQC → OQC)\n\n📊 4. Sample test (5 min)\n- Order a sample and test it yourself\n- Check pivot tightness, edge sharpness, handle durability\n- Compare with your current supplier's sample\n\nIf they pass all 4 → they're worth a real factory visit.\n\nIf they fail any → move on. There are 3,000+ kitchenware factories in Yangjiang alone.\n\n#sourcing #kitchenware #factoryvetting #OEM`
    ];

function addSocialKeyword(){
  const kw = document.getElementById('sm_newKeyword').value.trim();
  if(!kw) return;
  if(!S.socialMonitor) S.socialMonitor = {keywords:[],posts:[],painPoints:[],leads:[],lastScan:null};
  if(!S.socialMonitor.keywords) S.socialMonitor.keywords = [];
  if(S.socialMonitor.keywords.includes(kw)){ toast('关键词已存在'); return; }
  S.socialMonitor.keywords.push(kw);
  try{ DB.save('socialMonitor',S.socialMonitor); }catch(e){}
  document.getElementById('sm_newKeyword').value='';
  go('socialmonitor');
  toast('已添加关键词：'+kw);
}

function removeSocialKeyword(idx){
  if(!S.socialMonitor||!S.socialMonitor.keywords) return;
  S.socialMonitor.keywords.splice(idx,1);
  try{ DB.save('socialMonitor',S.socialMonitor); }catch(e){}
  go('socialmonitor');
  toast('已删除关键词');
}

function runSocialScan(){
  toast('正在扫描社媒平台...');

function generateLeadEmail(idx){
  const posts = (S.socialMonitor&&S.socialMonitor.posts&&S.socialMonitor.posts.length)?S.socialMonitor.posts:MOCK_SOCIAL_POSTS;
  const leads = posts.filter(p=>p.engagement==='high'&&p.painPoint);
  const p = leads[idx];
  if(!p) return;
  const painPoint = p.painPoint;
  let solution = '';
  if(painPoint.includes('质量')) solution = '我们实行零缺陷政策，每批产品通过LFGB/FDA认证，提供完整质检报告';
  else if(painPoint.includes('MOQ')) solution = '我们支持500pcs小批量试单，让您以低成本测试市场';
  else if(painPoint.includes('价格')) solution = '我们提供阶梯报价，量大优惠，长期合作可锁定价格';
  else if(painPoint.includes('合规')||painPoint.includes('BSCI')) solution = '我们拥有BSCI/LFGB/FDA全套认证，可随时提供审计报告';
  else if(painPoint.includes('小单')) solution = '我们有专业小单服务团队，500pcs起做，质量与大单完全一致';
  else if(painPoint.includes('关税')) solution = '我们可以提供DDP报价方案，帮助您分担关税成本';
  else if(painPoint.includes('环保')) solution = '我们已开发环保材料产品线，包括可回收钢材和植物基手柄';
  else solution = '我们有20年OEM经验，月产50万把，可满足您的各种需求';
  const email = `Subject: Quick solution for your ${painPoint} challenge\n\nHi ${p.author.split(' ')[0]||'there'},\n\nI came across your post about "${painPoint}" and wanted to reach out directly.\n\nWe're a Yangjiang-based kitchenware manufacturer with 20 years of OEM experience. Here's how we can help:\n\n✅ ${solution}\n\nWe currently supply to clients in the US, UK, Germany, and Australia. I'd be happy to send you our catalog and a free sample for evaluation.\n\nWould you be open to a quick 10-minute call this week?\n\nBest regards,\n锴利 KaiLionCrafts\nYangjiang, China\nWhatsApp: +86 138 xxxx xxxx`;
  openModal(`
    <div class="modal-head"><h3>✉️ 基于痛点的定制开发信</h3><span class="modal-close" onclick="closeModal()">×</span></div>
    <div class="modal-body">
      <div class="text-xs text-muted mb8" style="line-height:1.6">
        <b>客户：</b>${p.author} (${SOCIAL_PLATFORMS.find(x=>x.key===p.platform)?.label||p.platform})<br>
        <b>痛点：</b>${painPoint}<br>
        <b>解决方案：</b>${solution}
      </div>
      <div style="background:#f7fafc;padding:12px;border-radius:8px;white-space:pre-wrap;font-size:12px;line-height:1.8;max-height:400px;overflow-y:auto">${email}</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeModal()">关闭</button>
      <button class="btn btn-primary" onclick="navigator.clipboard.writeText(\`${email.replace(/`/g,'\\`')}\`);toast('已复制到剪贴板')">📋 复制开发信</button>
    </div>`);
}

function mailQualityBadge(m){
  const issues=[];
  if(m.subject.length>60)issues.push('标题过长');
  if(m.body&&m.body.split(/\s+/).length>300)issues.push('超300词');
  if(m.body&&!m.body.includes(m.customer.split(' ')[0]))issues.push('缺个性化');
  if(m.body&&(m.body.includes('.pdf')||m.body.includes('附件')))issues.push('首封带附件');
  if(!issues.length)return '<span class="badge badge-a">✅ 质检通过</span>';
  return `<span class="badge badge-gold">⚠️ ${issues.join('、')}</span>`;
}

function sendSingleMail(id){

  const m=S.mailQueue.find(x=>x.id===id);if(!m)return;
  toast(`正在发送给 ${m.customer}...`);
  setTimeout(()=>{

function batchSendMails(){
  if(!S.smtpConfig){toast('请先配置SMTP','error');return;}
  const approved=S.mailQueue.filter(m=>m.status==='已审核');
  if(!approved.length){toast('没有已审核的邮件','error');return;}
  const dailyLimit=(S.smtpConfig&&S.smtpConfig.dailyLimit)||50;
  const todaySent=S.mailLogs.filter(l=>l.date===todayStr()).length;
  if(todaySent+approved.length>dailyLimit){toast(`今日发送将超出上限(${dailyLimit}封)，请减少数量或明日再发`,'error');return;}
  showModal(`
    <div class="modal-title">🚀 批量发送确认</div>
    <div class="text-sm mb12">即将发送 <b style="color:var(--gold)">${approved.length}</b> 封开发信：</div>
    <div style="max-height:200px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:6px;padding:8px">
      ${approved.map(m=>`<div class="text-sm py4">📧 ${esc(m.customer)} &lt;${esc(m.email)}&gt;</div>`).join('')}
    </div>
    <div class="mt12 text-xs text-muted">发送间隔：每封随机3-8秒（模拟真实人工发送，降低被标记为垃圾邮件风险）</div>
    <div class="btn-row mt16">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-gold" onclick="closeModal();executeBatchSend()">🚀 确认发送</button>
    </div>`);
}
function executeBatchSend(){
  const approved=S.mailQueue.filter(m=>m.status==='已审核');
  let i=0;let success=0;let failed=0;
  toast(`开始批量发送 ${approved.length} 封...`);
  function sendNext(){
    if(i>=approved.length){
      toast(`批量发送完成：成功${success}封，失败${failed}封`);
      renderView();return;
    }
    const m=approved[i];
    const ok=Math.random()>0.1;
    const log={...m,id:'log_'+Date.now()+'_'+i,status:ok?'发送成功':'发送失败',sentAt:nowStr(),date:todayStr(),replied:false};
    S.mailLogs.push(log);
    if(ok)success++;else failed++;
    S.mailQueue=S.mailQueue.filter(x=>x.id!==m.id);
    i++;
    if(i%3===0||i===approved.length){DB.save('mailLogs',S.mailLogs);DB.save('mailQueue',S.mailQueue);}
    setTimeout(sendNext,500+Math.random()*1000);
  }
  sendNext();
}

function createDevPlan(){
  const industry = document.getElementById('dp_industry').value;
  const keyword = document.getElementById('dp_keyword').value.trim();
  const country = document.getElementById('dp_country').value;
  const count = parseInt(document.getElementById('dp_count').value);
  const rhythm = document.querySelector('input[name="dp_rhythm"]:checked').value;
  if(!keyword){toast('请输入产品关键词','error');return;}
  const plan = {
    id:'plan_'+Date.now(),
    name: country+' '+keyword+'开发计划',
    industry:industry, keyword:keyword, country:country, count:count, rhythm:rhythm,
    status:'运行中', progress:5, found:0, sent:0, sGrade:0, aGrade:0, bGrade:0,
    customers:[], logs:[], createdAt:new Date().toLocaleString('zh-CN')
  };
  S.devPlans.unshift(plan);
  DB.save('devPlans',S.devPlans);
  toast('计划已创建，AI开始自动运行...');
  renderView();
  simulateDevPlan(plan.id);
}
function simulateDevPlan(planId){
  const plan = S.devPlans.find(p=>p.id===planId);
  if(!plan||plan.status!=='运行中') return;
  const stages = [
    {pct:15,log:'🔍 正在搜索相关网站...',found:Math.floor(plan.count*0.3)},
    {pct:35,log:'📊 正在分析公司信息...',found:Math.floor(plan.count*0.5)},
    {pct:55,log:'⭐ 正在评级筛选客户（S/A/B级）...',found:Math.floor(plan.count*0.7)},
    {pct:75,log:'📧 正在挖掘决策人邮箱...',found:plan.count},
    {pct:90,log:'✉️ 正在生成个性化开发信...',found:plan.count},
    {pct:100,log:'✅ 计划完成！开发信已进入发送队列',found:plan.count}
  ];
  let i=0;
  function nextStage(){
    if(i>=stages.length){
      plan.status='已完成';
      plan.progress=100;
      plan.sent=Math.floor(plan.count*0.6);
      plan.sGrade=Math.floor(plan.count*0.05);
      plan.aGrade=Math.floor(plan.count*0.2);
      plan.bGrade=Math.floor(plan.count*0.35);
      plan.logs.push({time:new Date().toLocaleString('zh-CN'),msg:'✅ 计划完成'});
      DB.save('devPlans',S.devPlans);
      renderView();
      return;
    }
    const s=stages[i];
    plan.progress=s.pct;
    plan.found=s.found;
    plan.logs.push({time:new Date().toLocaleString('zh-CN'),msg:s.log});
    if(plan.logs.length>20) plan.logs=plan.logs.slice(-20);
    DB.save('devPlans',S.devPlans);
    renderView();
    i++;
    setTimeout(nextStage,1500);
  }
  nextStage();
}
function viewDevPlanDetail(planId){

function followDaysBadge(c){
  const lastFollow = (c.followUpHistory && c.followUpHistory.length) ? c.followUpHistory[c.followUpHistory.length-1].t : c.createdAt;
  if(!lastFollow) return '<span class="text-xs text-muted">无记录</span>';
  const days = Math.floor((new Date() - new Date(lastFollow)) / (1000*60*60*24));
  let color, bg, label;
  if(days <= 7){ color='#16a34a'; bg='#f0fdf4'; label='正常'; }
  else if(days <= 14){ color='#ca8a04'; bg='#fefce8'; label='需关注'; }
  else if(days <= 30){ color='#ea580c'; bg='#fff7ed'; label='快超时'; }
  else { color='#dc2626'; bg='#fef2f2'; label='已超时'; }
  return `<span style="display:inline-block;padding:2px 8px;border-radius:10px;background:${bg};color:${color};font-size:11px;font-weight:bold">${days}天</span> <span class="text-xs" style="color:${color}">${label}</span>`;
}
function getFollowOverdueCount(){
  let count = 0;
  S.customers.forEach(c=>{
    const lastFollow = (c.followUpHistory && c.followUpHistory.length) ? c.followUpHistory[c.followUpHistory.length-1].t : c.createdAt;
    if(lastFollow){
      const days = Math.floor((new Date() - new Date(lastFollow)) / (1000*60*60*24));
      if(days > 14) count++;
    }
  });
  return count;
}
function getTodayFollowCount(){
  let count = 0;
  const today = new Date().toDateString();
  S.customers.forEach(c=>{
    if(c.nextFollowUp && new Date(c.nextFollowUp).toDateString() === today) count++;
  });
  return count;
}

      direct:`${firstName},\n\nQuick pitch: We make kitchen shears in Yangjiang, 20 years, 500k/month capacity, LFGB/FDA certified.\n\nFor ${company}:\n• Factory direct pricing (15-25% below trading companies)\n• OEM with your logo/packaging\n• MOQ 500 pcs\n\nWant a quote? Send me your target specs or current supplier price. I'll get back within 24 hours.\n\nKaiLionCrafts`
    }
  };
  const subject = (subjects[language] && subjects[language][tone]) || subjects.English[tone];
  const body = (bodies[language] && bodies[language][tone]) || bodies.English[tone];
  const wordCount = body.split(/\s+/).filter(Boolean).length;
  document.getElementById('ml_result').innerHTML = `
    <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;margin-top:16px">
      <div class="flex-between mb12" style="align-items:center">
        <div class="flex gap8" style="align-items:center">
          <span style="font-size:20px">${flag}</span>
          <span class="fw700">${language} 开发信</span>
          <span class="badge badge-blue">${toneLabels[tone]}</span>
          <span class="badge badge-gray">${lengthLabels[length]}</span>
        </div>
        <span class="text-sm text-muted">${wordCount} 词 · 客户: ${company} (${country})</span>
      </div>
      <div style="background:#f7fafc;padding:12px;border-radius:8px;margin-bottom:12px">
        <div class="text-xs text-muted mb4"><b>主题 (Subject):</b></div>
        <div class="fw700">${subject}</div>
      </div>
      <div style="background:#f7fafc;padding:12px;border-radius:8px">
        <div class="text-xs text-muted mb4"><b>正文 (Body):</b></div>
        <div style="white-space:pre-wrap;line-height:1.8;font-size:14px">${body.replace(/\n/g,'\n')}</div>
      </div>
      <div class="mt12 text-xs text-muted" style="line-height:1.8">
        💡 <b>发送建议：</b>最佳发送时间 ${country==='美国'?'美东时间 9:00-10:00':country==='德国'?'中欧时间 10:00-11:00':country==='日本'?'日本时间 10:00-11:00':'当地时间 9:00-11:00'}，避免周一早上和周五下午发送。
      </div>
    </div>`;
  toast('AI已生成'+language+'开发信（'+toneLabels[tone]+'风格）');
}
function copyMultiLangResult(){
  const result = document.getElementById('ml_result');
  if(!result || !result.innerText){ toast('请先生成开发信','error'); return; }
  const text = result.innerText;
  navigator.clipboard.writeText(text).then(()=>toast('已复制到剪贴板')).catch(()=>toast('复制失败，请手动选择','error'));
}
</script>

</body>
