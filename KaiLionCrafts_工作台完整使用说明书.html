<title>KaiLionCrafts AI工作台 · 完整使用说明书</title>
<style>
:root {
  --primary: #c8102e;
  --primary-dark: #9a0c23;
  --dark: #1a1a2e;
  --dark2: #16213e;
  --accent: #e94560;
  --bg: #f8f9fa;
  --card: #ffffff;
  --text: #333;
  --text2: #666;
  --border: #e0e0e0;
  --green: #28a745;
  --orange: #fd7e14;
  --blue: #007bff;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--text); line-height:1.7; }

/* 顶部 */
.hero { background: linear-gradient(135deg, var(--dark) 0%, var(--dark2) 100%); color:#fff; padding:40px 20px; text-align:center; }
.hero h1 { font-size:2.2em; margin-bottom:10px; }
.hero .sub { opacity:.8; font-size:1.1em; }
.hero .badges { margin-top:15px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.hero .badge { background:rgba(255,255,255,.15); padding:4px 14px; border-radius:20px; font-size:.85em; }

/* 布局 */
.wrapper { display:flex; max-width:1400px; margin:0 auto; }
.sidebar { width:280px; background:#fff; border-right:1px solid var(--border); padding:20px; position:sticky; top:0; height:100vh; overflow-y:auto; flex-shrink:0; }
.sidebar h3 { font-size:.9em; color:var(--text2); margin:15px 0 8px; text-transform:uppercase; letter-spacing:1px; }
.sidebar a { display:block; padding:6px 10px; color:var(--text); text-decoration:none; border-radius:6px; font-size:.92em; }
.sidebar a:hover { background:var(--bg); color:var(--primary); }
.sidebar a.active { background:#fff0f1; color:var(--primary); font-weight:600; }
.main { flex:1; padding:30px; min-width:0; }

/* 搜索框 */
.search-box { margin-bottom:15px; }
.search-box input { width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:.95em; }

/* 内容卡片 */
.card { background:var(--card); border-radius:12px; padding:25px; margin-bottom:20px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.card h2 { color:var(--dark); border-left:4px solid var(--primary); padding-left:12px; margin-bottom:15px; font-size:1.4em; }
.card h3 { color:var(--dark); margin:18px 0 10px; font-size:1.15em; }
.card h4 { color:var(--text); margin:12px 0 8px; font-size:1.05em; }
.card p { margin-bottom:10px; }
.card ul, .card ol { margin:8px 0 12px 20px; }
.card li { margin-bottom:5px; }

/* 标签 */
.tag { display:inline-block; padding:2px 10px; border-radius:12px; font-size:.8em; margin-right:5px; }
.tag-ai { background:#e3f2fd; color:#1565c0; }
.tag-free { background:#e8f5e9; color:#2e7d32; }
.tag-config { background:#fff3e0; color:#e65100; }
.tag-optional { background:#f3e5f5; color:#7b1fa2; }

/* 步骤 */
.step { display:flex; gap:12px; margin:12px 0; }
.step-num { background:var(--primary); color:#fff; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; flex-shrink:0; }
.step-content { flex:1; }

/* 提示框 */
.tip { background:#e3f2fd; border-left:4px solid var(--blue); padding:12px 16px; border-radius:0 8px 8px 0; margin:12px 0; }
.warning { background:#fff3e0; border-left:4px solid var(--orange); padding:12px 16px; border-radius:0 8px 8px 0; margin:12px 0; }
.success { background:#e8f5e9; border-left:4px solid var(--green); padding:12px 16px; border-radius:0 8px 8px 0; margin:12px 0; }

/* 表格 */
table { width:100%; border-collapse:collapse; margin:12px 0; font-size:.92em; }
th, td { border:1px solid var(--border); padding:8px 12px; text-align:left; }
th { background:var(--dark); color:#fff; }
tr:nth-child(even) { background:var(--bg); }

/* 代码 */
code { background:#f0f0f0; padding:2px 6px; border-radius:4px; font-family:"SF Mono", Monaco, monospace; font-size:.9em; color:var(--primary); }

/* 功能网格 */
.feature-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:15px; margin:15px 0; }
.feature-item { background:var(--bg); border-radius:8px; padding:15px; border:1px solid var(--border); }
.feature-item .icon { font-size:1.8em; margin-bottom:8px; }
.feature-item .name { font-weight:600; margin-bottom:5px; }
.feature-item .desc { font-size:.88em; color:var(--text2); }

/* 目录折叠 */
details { margin:8px 0; }
summary { cursor:pointer; font-weight:600; padding:8px; background:var(--bg); border-radius:6px; }
details[open] summary { background:#e8e8e8; }

/* 回到顶部 */
#backtop { position:fixed; bottom:30px; right:30px; width:45px; height:45px; border-radius:50%; background:var(--primary); color:#fff; border:none; cursor:pointer; font-size:20px; box-shadow:0 2px 8px rgba(0,0,0,.2); display:none; }

@media (max-width:900px) {
  .wrapper { flex-direction:column; }
  .sidebar { width:100%; height:auto; position:relative; border-right:none; border-bottom:1px solid var(--border); }
}
</style>
</head>

// 渲染目录
const toc = document.getElementById('toc');
const main = document.getElementById('mainContent');
let tocHTML = '';
let contentHTML = '';

sections.forEach((sec, si) => {
  tocHTML += `<h3>${sec.icon} ${sec.title}</h3>`;
  sec.items.forEach((item, ii) => {
    const id = item.id;
    tocHTML += `<a href="#${id}" data-target="${id}">${item.title}</a>`;
    contentHTML += `<div class="card" id="${id}">
      <h2>${sec.icon} ${item.title}</h2>
      <p>${item.tags.map(t => `<span class="tag tag-${t.includes('AI')?'ai':t.includes('免费')?'free':t.includes('配置')?'config':'optional'}">${t}</span>`).join('')}</p>
      ${item.content}
    </div>`;
  });
});
toc.innerHTML = tocHTML;
main.innerHTML = contentHTML;

// 搜索
document.getElementById('searchInput').addEventListener('input', function(e) {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.card').forEach(card => {
    const text = card.textContent.toLowerCase();
    card.style.display = (!q || text.includes(q)) ? '' : 'none';
  });
  document.querySelectorAll('.sidebar a').forEach(a => {
    const text = a.textContent.toLowerCase();
    a.style.display = (!q || text.includes(q)) ? '' : 'none';
  });
});

// 回到顶部
window.onscroll = function() {
  document.getElementById('backtop').style.display = window.scrollY > 300 ? 'block' : 'none';
};

// 高亮当前目录
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
      const link = document.querySelector(`.sidebar a[data-target="${e.target.id}"]`);
      if (link) link.classList.add('active');
    }
  });
}, {rootMargin: '-20% 0px -70% 0px'});
document.querySelectorAll('.card').forEach(c => observer.observe(c));
</script>
